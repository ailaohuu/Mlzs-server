<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理员控制台 - 设备监控系统</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!--<link href="https://cdn.staticfile.org/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">-->
  <link href="./css/font-awesome.min.css" rel="stylesheet">
  
  <script src="./js/tailwind-config.js"></script>
  
  <style type="text/tailwindcss">
    @layer utilities {
      .device-card {
        @apply border rounded-lg p-3 cursor-pointer transition-all hover:shadow-md;
      }
      .device-card.active {
        @apply border-primary bg-blue-50;
      }
      .pulse {
        animation: pulse 2s infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.6; }
      }
    }
  </style>
</head>

<body class="bg-gray-50 min-h-screen">
  <!-- 导航栏 -->
  <header class="bg-white shadow-sm sticky top-0 z-10">
    <div class="container mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-2">
      <div class="flex items-center">
        <i class="fa fa-server text-primary text-xl mr-2"></i>
        <h1 class="text-lg font-bold text-primary">管理员控制台</h1>
      </div>
      
      <div class="flex items-center gap-4 text-sm">
        <span id="userInfo" class="text-gray-600 flex items-center">
          <i class="fa fa-user-circle text-primary mr-1"></i>
          <span id="username"></span>
        </span>
        <button id="changePasswordBtn" class="px-3 py-1 text-sm bg-blue-100 hover:bg-blue-200 text-blue-700 rounded transition-colors">修改密码</button>
        <button onclick="logout()" class="text-gray-500 hover:text-red-500">
          <i class="fa fa-sign-out mr-1"></i>退出
        </button>
        <span id="systemTime" class="text-gray-500"></span>
      </div>
    </div>
  </header>

  <!-- 主内容 -->
  <main class="container mx-auto px-4 py-6">
    <div class="bg-white rounded-xl p-5 shadow-md">
      <!-- 功能栏 -->
      <div class="mb-6 flex justify-between items-center">
        <h2 class="text-base font-medium flex items-center">
          <i class="fa fa-cog text-primary mr-2"></i>管理功能
        </h2>
        <div class="flex gap-3">
          <button id="refreshAllBtn" class="text-sm px-3 py-1 bg-primary/10 text-primary rounded-md hover:bg-primary/20 transition-colors">
            <i class="fa fa-refresh mr-1"></i>刷新所有
          </button>
          <button id="viewAllDevicesBtn" class="text-sm px-3 py-1 bg-primary text-white rounded-md hover:bg-primary/90 transition-colors">
            <i class="fa fa-list-ul mr-1"></i>所有设备
          </button>
        </div>
      </div>

      <!-- 统计卡片 -->
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4 mb-6">
        <!-- 添加用户管理卡片 -->
        <div id="userManagementCard" class="bg-purple-50 border border-purple-100 rounded-lg p-4 cursor-pointer hover:shadow-md transition-all">
          <div class="flex justify-between items-start">
            <div>
              <p class="text-gray-500 text-sm">用户管理</p>
              <h3 class="text-2xl font-bold text-gray-800 mt-1" id="userManagementCount">管理用户</h3>
            </div>
            <div class="w-10 h-10 rounded-full bg-purple-200 flex items-center justify-center text-purple-600">
              <i class="fa fa-users-cog"></i>
            </div>
          </div>
          <div class="mt-2 text-xs text-gray-500">
            <span class="text-purple-600"><i class="fa fa-cog mr-1"></i>添加/编辑/删除用户</span>
          </div>
        </div>
        <div class="bg-blue-50 border border-blue-100 rounded-lg p-4">
          <div class="flex justify-between items-start">
            <div>
              <p class="text-gray-500 text-sm">在线设备总数</p>
              <h3 class="text-2xl font-bold text-gray-800 mt-1" id="totalOnline">--</h3>
            </div>
            <div class="w-10 h-10 rounded-full bg-primary/20 flex items-center justify-center text-primary">
              <i class="fa fa-desktop"></i>
            </div>
          </div>
          <div class="mt-2 text-xs text-gray-500">
            <span class="text-success"><i class="fa fa-arrow-up mr-1"></i>实时统计</span>
          </div>
        </div>
        
        <div class="bg-indigo-50 border border-indigo-100 rounded-lg p-4">
          <div class="flex justify-between items-start">
            <div>
              <p class="text-gray-500 text-sm">总设备数</p>
              <h3 class="text-2xl font-bold text-gray-800 mt-1" id="totalDevices">--</h3>
            </div>
            <div class="w-10 h-10 rounded-full bg-indigo-200 flex items-center justify-center text-indigo-600">
              <i class="fa fa-cubes"></i>
            </div>
          </div>
          <div class="mt-2 text-xs text-gray-500">
            <span class="text-indigo-600"><i class="fa fa-database mr-1"></i>在线+离线</span>
          </div>
        </div>

        <div class="bg-green-50 border border-green-100 rounded-lg p-4">
          <div class="flex justify-between items-start">
            <div>
              <p class="text-gray-500 text-sm">使用人总数</p>
              <h3 class="text-2xl font-bold text-gray-800 mt-1" id="totalMasters">--</h3>
            </div>
            <div class="w-10 h-10 rounded-full bg-success/20 flex items-center justify-center text-success">
              <i class="fa fa-users"></i>
            </div>
          </div>
          <div class="mt-2 text-xs text-gray-500">
            <span class="text-success"><i class="fa fa-arrow-up mr-1"></i>实时统计</span>
          </div>
        </div>

        <div class="bg-purple-50 border border-purple-100 rounded-lg p-4">
          <div class="flex justify-between items-start">
            <div>
              <p class="text-gray-500 text-sm">系统用户</p>
              <h3 class="text-2xl font-bold text-gray-800 mt-1" id="totalUsers">--</h3>
            </div>
            <div class="w-10 h-10 rounded-full bg-purple-200 flex items-center justify-center text-purple-600">
              <i class="fa fa-user-circle"></i>
            </div>
          </div>
          <div class="mt-2 text-xs text-gray-500">
            <span><i class="fa fa-eye mr-1"></i>包含管理员</span>
          </div>
        </div>

        <div class="bg-yellow-50 border border-yellow-100 rounded-lg p-4">
          <div class="flex justify-between items-start">
            <div>
              <p class="text-gray-500 text-sm">活跃会话</p>
              <h3 class="text-2xl font-bold text-gray-800 mt-1" id="activeSessions">--</h3>
            </div>
            <div class="w-10 h-10 rounded-full bg-yellow-200 flex items-center justify-center text-yellow-600">
              <i class="fa fa-plug"></i>
            </div>
          </div>
          <div class="mt-2 text-xs text-gray-500">
            <span class="text-yellow-600"><i class="fa fa-clock-o mr-1"></i>最近5分钟</span>
          </div>
        </div>
      </div>

      <!-- 筛选区域 -->
      <div class="mb-6 bg-gray-50 p-4 rounded-lg">
        <div class="flex flex-col sm:flex-row gap-4">
          <div class="flex-1">
            <label class="block text-sm font-medium text-gray-700 mb-1">使用人筛选</label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                <i class="fa fa-user"></i>
              </span>
              <select id="masterFilter" class="w-full pl-10 pr-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-primary/30 focus:border-primary">
                <option value="">所有使用人</option>
                <!-- 动态生成选项 -->
              </select>
            </div>
          </div>
          <div class="flex-1">
            <label class="block text-sm font-medium text-gray-700 mb-1">设备ID搜索</label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                <i class="fa fa-search"></i>
              </span>
              <input type="text" id="deviceSearch" 
                     class="w-full pl-10 pr-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-primary/30 focus:border-primary" 
                     placeholder="输入设备ID搜索">
            </div>
          </div>
          <div class="flex items-end">
            <button id="searchBtn" class="w-full sm:w-auto px-4 py-2 bg-primary text-white rounded-md hover:bg-primary/90 transition-colors">
              <i class="fa fa-filter mr-1"></i>筛选
            </button>
          </div>
        </div>
      </div>

      <!-- 日志区域（上方） -->
      <div class="mb-6">
        <div class="flex justify-between items-center mb-3">
          <h2 class="text-base font-medium flex items-center">
            <i class="fa fa-file-text-o text-primary mr-2"></i>设备日志详情
          </h2>
          <span id="currentDevice" class="text-xs text-gray-500">未选择设备</span>
        </div>
        
        <div class="relative">
          <div class="absolute top-2 right-2 text-xs text-gray-400">
            <i class="fa fa-refresh fa-spin mr-1"></i>
            <span id="logUpdateTime">未更新</span>
          </div>
          <div id="logContent" class="bg-gray-900 text-gray-100 p-4 rounded-lg min-h-[200px] max-h-[300px] overflow-y-auto text-sm whitespace-pre-wrap">
            <div class="flex items-center justify-center h-200 text-gray-400">
              <i class="fa fa-hand-pointer-o mr-2"></i>请从下方选择设备查看日志
            </div>
          </div>
        </div>
      </div>

      <!-- 设备列表（下方） -->
      <div>
        <div class="flex justify-between items-center mb-3">
          <h2 class="text-base font-medium flex items-center">
            <i class="fa fa-list-ul text-primary mr-2"></i>所有在线设备列表
          </h2>
          <span class="text-xs text-gray-500 flex items-center">
            <i class="fa fa-refresh pulse mr-1"></i>
            自动刷新中
          </span>
        </div>
        
        <div id="deviceList" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3 max-h-[400px] overflow-y-auto pr-1">
          <!-- 设备卡片将通过JS动态生成 -->
          <div class="col-span-full flex justify-center items-center p-6 text-gray-500">
            <i class="fa fa-spinner fa-spin mr-2"></i>加载设备中...
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="./js/admin.js"></script>
</body>
</html>
